<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Happy 4th Birthday, Sreevidya!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Great+Vibes&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* H View · "Royal Party" premium kids birthday (photo-real r84) (r83, 26 Nov 2026): a lit party hall, balloon arch, gold foil name balloons,
   rose-gold number balloon, framed photos and a fondant cake with real-looking candle flames. No characters, no cartoons. */
:root{--gold1:#7a5a17;--gold2:#f7e2a0;--rose:#e8a7b5;--ink:#2a1a2e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07050b;font-family:Inter,system-ui,sans-serif;color:#fff;user-select:none}
#hall{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#3a1f35 0%,#1c0f1d 55%,#0a060c 100%)}
#hall:after{content:'';position:absolute;inset:0;background:#000;opacity:.92;transition:opacity 1.8s ease;pointer-events:none;z-index:20}
body.lit #hall:after{opacity:0}
/* back wall: soft panelling + warm wash */
.wall{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 120px),radial-gradient(70% 55% at 50% 38%,rgba(255,190,200,.38),rgba(120,50,80,.15) 55%,transparent 75%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#2a1622,#140a11);box-shadow:0 -1px 0 rgba(255,220,200,.12)}
.floor:before{content:'';position:absolute;inset:0;background:radial-gradient(60% 90% at 50% 0%,rgba(255,200,170,.22),transparent 70%)}
#bokeh{position:absolute;inset:0;width:100%;height:100%}
/* velvet curtains */
.curtain{position:absolute;top:0;bottom:0;width:52%;z-index:15;background:repeating-linear-gradient(90deg,#5d0f2a 0 18px,#7d1a3a 30px,#4a0b21 44px,#6e1533 58px);box-shadow:inset 0 0 80px rgba(0,0,0,.6);transition:transform 2.4s cubic-bezier(.7,0,.2,1)}
.curtain.l{left:0}.curtain.r{right:0}
.curtain:after{content:'';position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(90deg,#c9a24a,#f7e2a0,#b8892d,#f7e2a0,#c9a24a);opacity:.9}
body.open .curtain.l{transform:translateX(-96%)}body.open .curtain.r{transform:translateX(96%)}
.valance{position:absolute;top:0;left:0;right:0;height:44px;z-index:16;background:radial-gradient(40px 30px at 40px 0,#7d1a3a 70%,transparent 72%) repeat-x;background-size:80px 44px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.valance:after{content:'';position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(90deg,#b8892d,#f7e2a0,#b8892d)}
/* balloon layers (canvas) */
#arch{position:absolute;inset:0;width:100%;height:100%;z-index:3}
.layer{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transition:opacity .9s}
.layer.on{opacity:1;pointer-events:auto}
.foil{display:block;overflow:visible}
.namebox{position:absolute;top:15%;z-index:6;left:0;right:0;display:flex;justify-content:center;gap:0;padding:0 6px}
.nl{position:relative;transform:translateY(-110vh);transition:transform 1.4s cubic-bezier(.25,1.35,.45,1)}
.nl.in{transform:translateY(0);animation:float 3.4s ease-in-out infinite}
.nl svg{transition:opacity .35s,transform .5s cubic-bezier(.2,1.6,.4,1)}.nl.wait svg{opacity:0;transform:scale(.4)}.nl.wait:after{opacity:0}
.nl.wait:before{content:'\2726';position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);color:#f7e2a0;font-size:var(--dot,22px);text-shadow:0 0 12px rgba(255,220,150,.9);animation:tw2 1.3s ease-in-out infinite}
@keyframes tw2{50%{opacity:.35;transform:translate(-50%,-50%) scale(.7)}}
.nl:after{content:'';position:absolute;left:50%;top:92%;width:1px;height:14vh;background:linear-gradient(rgba(255,240,210,.7),rgba(255,240,210,0))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.big4{position:relative;transform:translateY(80vh) scale(.6);transition:transform 2s cubic-bezier(.25,1.2,.4,1)}
.big4.in{transform:none;animation:float 4s ease-in-out 2s infinite}
.cap{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(24px,6.4vw,44px);line-height:1.1;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.cap i{font-family:'Great Vibes',cursive;font-style:normal;font-weight:400;font-size:1.35em;background:linear-gradient(90deg,#d9a84a,#fff1c1,#c08a2e,#fbe7a9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:8px;font-size:clamp(14px,3.6vw,18px);color:rgba(255,236,230,.85)}
/* photo frames */
.frames{position:absolute;top:12%;left:0;right:0;height:62%}
.frame{position:absolute;width:clamp(120px,30vw,200px);aspect-ratio:4/5;padding:12px;background:linear-gradient(135deg,#7a5a17,#f7e2a0 22%,#b8892d 45%,#fff1c1 60%,#8a6a1e 85%);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.25);opacity:0;transform:translateY(-20px) scale(.9);transition:all 1s cubic-bezier(.2,1.2,.4,1);cursor:pointer}
.frame.in{opacity:1;transform:rotate(var(--r)) }
.frame .ph{width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#f3dde3,#d9b8c4);box-shadow:inset 0 0 0 4px #fff8ee,inset 0 0 30px rgba(0,0,0,.25);display:grid;place-items:center}
.frame .ph img{width:100%;height:100%;object-fit:cover;animation:kb 9s ease-in-out infinite alternate}@keyframes kb{to{transform:scale(1.12) translate(-3%,-2%)}}
.frame .ph span{font:600 12px Inter;color:#8a5a6a;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:10px}
.spot{position:absolute;top:-20%;width:46%;height:120%;background:radial-gradient(50% 60% at 50% 0,rgba(255,240,220,.22),transparent 70%);pointer-events:none}
/* cake */
.cake{position:relative;width:min(84vw,56vh,470px);margin-top:3vh}
.cake svg{width:100%;overflow:visible;display:block}
.cnd{cursor:pointer}
.fl{transform-origin:center bottom;transform-box:fill-box;animation:flick .12s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}100%{transform:scale(1.04,.95) skewX(2deg)}}
.glow{transform-box:fill-box;transform-origin:center;animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{to{opacity:.75;transform:scale(1.1)}}
.cnd.out .fl,.cnd.out .glow{opacity:0;transition:opacity .25s;animation:none}
.smk{opacity:0}.cnd.out .smk{animation:smk 2.2s ease-out forwards}@keyframes smk{0%{opacity:.55;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-70px) scale(2.2)}}
.lightwash{position:absolute;inset:0;z-index:4;background:radial-gradient(40% 35% at 50% 62%,rgba(255,190,110,.35),transparent 70%);transition:opacity .8s;pointer-events:none}
/* final card */
.card{max-width:min(88vw,520px);padding:26px 24px 22px;border-radius:18px;background:linear-gradient(160deg,rgba(255,250,244,.97),rgba(250,236,232,.97));color:var(--ink);box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 0 0 1px rgba(185,140,60,.5),inset 0 0 0 7px rgba(255,255,255,.7),inset 0 0 0 8px rgba(185,140,60,.4)}
.card h2{font:800 clamp(24px,6.2vw,36px)/1.1 'Playfair Display',serif;background:linear-gradient(90deg,#8a6a1e,#c99a3a,#8a6a1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2 i{display:block;font:400 1.5em 'Great Vibes',cursive;background:linear-gradient(90deg,#b23a6a,#e07aa0,#b23a6a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:4px}
.card p{margin-top:12px;font:400 clamp(15px,3.9vw,17px)/1.6 Inter;color:#4b3446}
.card .fr{margin-top:12px;font:400 26px 'Great Vibes',cursive;color:#a0476d}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 20px;font:700 15px Inter;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.08),inset 0 0 0 1px #e4cfa0;text-decoration:none}
.btn.g{background:linear-gradient(90deg,#b8892d,#f1d48a,#b8892d);color:#3a2608}
.hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:rgba(20,10,18,.72);backdrop-filter:blur(6px);border:1px solid rgba(247,226,160,.45);color:#fbe9c0;font:600 15px Inter;padding:10px 18px;border-radius:999px;white-space:nowrap;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
.start{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 45%,#2a1424,#07050b 70%);cursor:pointer;padding:24px}
.switch{width:78px;height:118px;margin:0 auto 18px;border-radius:14px;background:linear-gradient(160deg,#f6efe4,#d7cbb8);box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.6);position:relative}
.switch:after{content:'';position:absolute;left:24px;right:24px;top:22px;height:44px;border-radius:8px;background:linear-gradient(#fff,#e6dccb);box-shadow:0 6px 8px rgba(0,0,0,.25);transition:all .25s}
.start.on .switch:after{top:52px;box-shadow:0 -4px 8px rgba(0,0,0,.2)}
.start h1{font:800 clamp(24px,6vw,36px)/1.15 'Playfair Display',serif}.start p{margin-top:8px;color:rgba(255,236,230,.75)}
.snd{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:45;width:42px;height:42px;border-radius:50%;border:1px solid rgba(247,226,160,.5);background:rgba(20,10,18,.6);color:#fbe9c0;font-size:18px;cursor:pointer}
.brand{position:fixed;left:12px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;font:600 11px Inter;color:rgba(255,236,230,.45)}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(8,4,8,.85);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s}.zoom.on{opacity:1;pointer-events:auto}
.zoom img{max-width:88vw;max-height:80vh;border:12px solid #f3e1b0;border-radius:4px;box-shadow:0 30px 80px #000}

/* r84: photo-real party: real images from /assets/inv/ replace the drawn hall, curtains and balloon arch */
.bg{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity 1.2s ease}
.bg.on{opacity:1}
.bg .blur{position:absolute;inset:-40px;background:center/cover no-repeat;filter:blur(28px) brightness(.55) saturate(1.1)}
.bg .ph{position:absolute;inset:0;background:center/contain no-repeat}
@media (max-aspect-ratio:3/4){.bg .ph{background-size:cover}}
.bg.kb .ph{animation:kb2 16s ease-in-out infinite alternate}@keyframes kb2{to{transform:scale(1.07)}}
.bg.dim .ph{filter:brightness(.62)}
.shade{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(10,4,10,.55) 0%,rgba(10,4,10,0) 30%,rgba(10,4,10,0) 62%,rgba(10,4,10,.7) 100%);pointer-events:none}
.gift{position:absolute;inset:0;z-index:6;cursor:pointer}
.ring{position:absolute;left:50%;top:58%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(255,236,200,.75);animation:ring 1.8s ease-out infinite;pointer-events:none}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.flash{position:absolute;inset:0;z-index:7;background:radial-gradient(circle at 50% 58%,#fff7e0,rgba(255,220,160,.6) 30%,transparent 65%);opacity:0;pointer-events:none}
.flash.go{animation:flash 1.1s ease-out}@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.rb{position:absolute;width:clamp(76px,19vw,130px);aspect-ratio:.401;background-repeat:no-repeat;background-size:385% auto;cursor:pointer;z-index:8;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35));animation:rise2 var(--d,9s) linear forwards}
.rb.p{background-position:12% 50.7%}.rb.g{background-position:50% 50.7%}.rb.c{background-position:87.9% 50.7%}
.rb.pop{animation:popb .32s forwards}@keyframes popb{60%{transform:scale(1.3);opacity:.8}100%{transform:scale(0);opacity:0}}
@keyframes rise2{from{transform:translateY(110vh)}to{transform:translateY(-120vh)}}
.gframe{position:absolute;width:clamp(130px,32vw,210px);aspect-ratio:825/1024;opacity:0;transform:translateY(-24px) scale(.92);transition:all 1s cubic-bezier(.2,1.2,.4,1);cursor:pointer;filter:drop-shadow(0 18px 26px rgba(0,0,0,.55))}
.gframe.in{opacity:1;transform:rotate(var(--r))}
.gframe .in2{position:absolute;left:21%;right:21%;top:19%;bottom:19%;background:linear-gradient(160deg,#f6e4e8,#e3c3cd);overflow:hidden;display:grid;place-items:center}
.gframe .in2 img{width:100%;height:100%;object-fit:cover}.gframe .in2 span{font:600 11px Inter;color:#8a5a6a;letter-spacing:.08em;text-transform:uppercase}
.gframe>.fr{position:absolute;inset:0;background-position:center;background-size:contain;background-repeat:no-repeat}
#spark{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.blowbtn{position:relative;margin-top:auto;margin-bottom:calc(70px + env(safe-area-inset-bottom));width:108px;height:108px;border-radius:50%;border:1.5px solid rgba(247,226,160,.8);background:rgba(20,10,18,.45);backdrop-filter:blur(4px);color:#fbe9c0;font:700 12px/1.2 Inter;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;touch-action:none;-webkit-touch-callout:none;user-select:none}
.blowbtn svg{position:absolute;inset:-6px;width:120px;height:120px;transform:rotate(-90deg)}.blowbtn circle{fill:none;stroke:#f7e2a0;stroke-width:4;stroke-dasharray:352;stroke-dashoffset:352;stroke-linecap:round}
img,.bg{-webkit-touch-callout:none;-webkit-user-drag:none}

/* r85: three more openings (HV.theme = sparkler | lantern | popwall) */
#mist{position:absolute;inset:0;z-index:9;width:100%;height:100%;touch-action:none;cursor:pointer}
#wr{position:absolute;inset:0;z-index:5;width:100%;height:100%;pointer-events:none}
.lan{position:absolute;bottom:14%;width:clamp(46px,11vw,72px);aspect-ratio:.78;z-index:8;cursor:pointer;transition:transform 4.5s cubic-bezier(.3,.1,.3,1),opacity 1.2s;animation:lsway 3s ease-in-out infinite}
.lan:before{content:'';position:absolute;inset:0;border-radius:42% 42% 30% 30%/46% 46% 32% 32%;background:radial-gradient(ellipse at 50% 62%,#fff4c7 0%,#ffc867 28%,#f29a3a 62%,#b85a1c 100%);box-shadow:0 0 30px 10px rgba(255,170,70,.55),0 0 80px 30px rgba(255,150,60,.25);opacity:.55;transition:opacity .5s}
.lan:after{content:'';position:absolute;left:30%;right:30%;bottom:-5%;height:9%;border-radius:2px;background:#6b3a14}
.lan.lit:before{opacity:1}.lan.lit{animation:none}
.lan b{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(18px,4.6vw,28px) 'Playfair Display',serif;color:#6b2e0e;opacity:0;transition:opacity .4s}
.lan.lit b{opacity:.85}
@keyframes lsway{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.skyname{position:absolute;top:14%;left:0;right:0;display:flex;justify-content:center;z-index:7}
.wall{position:absolute;inset:0;z-index:8}
.wb{position:absolute;aspect-ratio:.401;background-repeat:no-repeat;background-size:385% auto;cursor:pointer;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));transform-origin:50% 40%;animation:wbob 3.2s ease-in-out infinite}
.wb.p{background-position:12% 50.7%}.wb.g{background-position:50% 50.7%}.wb.c{background-position:87.9% 50.7%}
.wb.pop{animation:popb .3s forwards}@keyframes wbob{50%{transform:translateY(-5px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="hall">
  <div class="bg kb" id="bgGift"><div class="blur"></div><div class="ph"></div></div>
  <div class="bg" id="bgOpen"><div class="blur"></div><div class="ph"></div></div>
  <div class="bg kb" id="bgRoom"><div class="blur"></div><div class="ph"></div></div>
  <div class="bg kb" id="bgCake"><div class="blur"></div><div class="ph"></div></div>
  <div class="bg kb" id="bgGarden"><div class="blur"></div><div class="ph"></div></div>
  <canvas id="spark"></canvas><canvas id="wr"></canvas><div class="shade"></div>
  <div class="gift" id="gift" hidden><div class="ring"></div></div><div class="flash" id="flash"></div>

  <section class="layer" id="L0"><div style="position:absolute;top:9%;left:0;right:0"><p class="cap" id="L0c"></p><p class="sub">A surprise is inside. Tap the gift!</p></div></section>
  <section class="layer" id="LS"><div style="position:absolute;top:9%;left:0;right:0;z-index:10;pointer-events:none"><p class="cap" id="LSc"></p><p class="sub" id="LSs"></p></div><canvas id="mist"></canvas></section>
  <section class="layer" id="LL"><div class="skyname" id="skyname"></div><div id="lans"></div><div style="position:absolute;bottom:13%;left:0;right:0;pointer-events:none;z-index:9"><p class="cap" id="LLc"></p></div></section>
  <section class="layer" id="LW"><div class="wall" id="wall"></div><div class="namebox" id="wname" style="z-index:5"></div></section>
  <section class="layer" id="L1"><div class="namebox" id="namebox"></div><div id="rbs"></div>
    <div style="position:absolute;bottom:13%;left:0;right:0"><p class="cap" id="L1c"></p></div></section>
  <section class="layer" id="L2"><div class="big4" id="big4"></div><p class="cap" style="margin-top:2vh" id="L2c"></p><p class="sub" id="L2s"></p></section>
  <section class="layer" id="L3"><div class="frames" id="frames"></div>
    <div style="position:absolute;bottom:10%;left:0;right:0"><p class="cap"><i>Look how you’ve grown</i></p></div></section>
  <section class="layer" id="L4"><div style="position:absolute;top:8%;left:0;right:0"><p class="cap">Make a wish, <span id="L4n"></span></p><p class="sub">Close your eyes… then hold to blow</p></div>
    <button class="blowbtn" id="blow" aria-label="Press and hold to blow out the candles"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="56" id="ringp"/></svg>Hold<br>to blow</button></section>
  <section class="layer" id="L5"><div class="card"><h2><span id="L5a"></span><i id="L5n"></i></h2><p id="L5m"></p><div class="fr" id="L5f"></div>
    <div class="row"><button class="btn g" id="again">▶ Watch again</button><a class="btn" href="https://hview.in/interactive/birthday/" target="_blank" rel="noopener">Make one like this</a></div></div></section>
</div>
<canvas id="fx"></canvas>
<div class="zoom" id="zoom"><img alt=""></div>
<button class="snd" id="snd" aria-label="Sound">🔊</button>
<div class="start" id="start"><div><div class="switch"></div><h1 id="stT">A surprise is waiting</h1><p>Tap to switch on the lights</p></div></div>
<div class="hint" id="hint" hidden></div>
<div class="brand">Made with ♥ on H View</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a1e"/><stop offset=".25" stop-color="#f7e2a0"/><stop offset=".45" stop-color="#c3922f"/><stop offset=".62" stop-color="#fff3c8"/><stop offset=".8" stop-color="#b8892d"/><stop offset="1" stop-color="#6e5014"/></linearGradient>
    <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c5a5e"/><stop offset=".22" stop-color="#f9d3cf"/><stop offset=".45" stop-color="#d69a92"/><stop offset=".62" stop-color="#fff0ea"/><stop offset=".8" stop-color="#c98a84"/><stop offset="1" stop-color="#7d4247"/></linearGradient>
    <filter id="puffy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feSpecularLighting in="b" surfaceScale="6" specularConstant=".9" specularExponent="22" lighting-color="#fff" result="s"><fePointLight x="-60" y="-120" z="140"/></feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".85" k4="0" result="lit"/>
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
</svg>
<script>window.HV_DATA={"to":"Sreevidya","age":4,"theme":"lantern","photos":["placeholder:1","placeholder:2","placeholder:3","placeholder:4"]};</script>
<script>
(function(){
'use strict';
var HV = {}; try { HV = JSON.parse(decodeURIComponent(location.hash.slice(1))) || {}; } catch (e) {}
if (window.HV_DATA) HV = Object.assign({}, window.HV_DATA, HV);
var A = HV.assets || '/assets/inv/';
var NAME = String(HV.to || 'Little Princess').trim().slice(0, 14), AGE = Math.max(1, Math.min(12, parseInt(HV.age, 10) || 4));
