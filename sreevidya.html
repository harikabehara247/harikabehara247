<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Happy 4th Birthday, Sreevidya!</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Great+Vibes&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* H View · "Royal Party" premium kids birthday (r83, 26 Nov 2026): a lit party hall, balloon arch, gold foil name balloons,
   rose-gold number balloon, framed photos and a fondant cake with real-looking candle flames. No characters, no cartoons. */
:root{--gold1:#7a5a17;--gold2:#f7e2a0;--rose:#e8a7b5;--ink:#2a1a2e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07050b;font-family:Inter,system-ui,sans-serif;color:#fff;user-select:none}
#hall{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#3a1f35 0%,#1c0f1d 55%,#0a060c 100%)}
#hall:after{content:'';position:absolute;inset:0;background:#000;opacity:.92;transition:opacity 1.8s ease;pointer-events:none;z-index:20}
body.lit #hall:after{opacity:0}
/* back wall: soft panelling + warm wash */
.wall{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 120px),radial-gradient(70% 55% at 50% 38%,rgba(255,190,200,.38),rgba(120,50,80,.15) 55%,transparent 75%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#2a1622,#140a11);box-shadow:0 -1px 0 rgba(255,220,200,.12)}
.floor:before{content:'';position:absolute;inset:0;background:radial-gradient(60% 90% at 50% 0%,rgba(255,200,170,.22),transparent 70%)}
#bokeh{position:absolute;inset:0;width:100%;height:100%}
/* velvet curtains */
.curtain{position:absolute;top:0;bottom:0;width:52%;z-index:15;background:repeating-linear-gradient(90deg,#5d0f2a 0 18px,#7d1a3a 30px,#4a0b21 44px,#6e1533 58px);box-shadow:inset 0 0 80px rgba(0,0,0,.6);transition:transform 2.4s cubic-bezier(.7,0,.2,1)}
.curtain.l{left:0}.curtain.r{right:0}
.curtain:after{content:'';position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(90deg,#c9a24a,#f7e2a0,#b8892d,#f7e2a0,#c9a24a);opacity:.9}
body.open .curtain.l{transform:translateX(-96%)}body.open .curtain.r{transform:translateX(96%)}
.valance{position:absolute;top:0;left:0;right:0;height:44px;z-index:16;background:radial-gradient(40px 30px at 40px 0,#7d1a3a 70%,transparent 72%) repeat-x;background-size:80px 44px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.valance:after{content:'';position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(90deg,#b8892d,#f7e2a0,#b8892d)}
/* balloon layers (canvas) */
#arch{position:absolute;inset:0;width:100%;height:100%;z-index:3}
.layer{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transition:opacity .9s}
.layer.on{opacity:1;pointer-events:auto}
.foil{display:block;overflow:visible}
.namebox{position:absolute;top:15%;z-index:6;left:0;right:0;display:flex;justify-content:center;gap:0;padding:0 6px}
.nl{position:relative;transform:translateY(-110vh);transition:transform 1.4s cubic-bezier(.25,1.35,.45,1)}
.nl.in{transform:translateY(0);animation:float 3.4s ease-in-out infinite}
.nl:after{content:'';position:absolute;left:50%;top:92%;width:1px;height:46vh;background:linear-gradient(rgba(255,240,210,.7),rgba(255,240,210,0))}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.big4{position:relative;transform:translateY(80vh) scale(.6);transition:transform 2s cubic-bezier(.25,1.2,.4,1)}
.big4.in{transform:none;animation:float 4s ease-in-out 2s infinite}
.cap{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(24px,6.4vw,44px);line-height:1.1;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.cap i{font-family:'Great Vibes',cursive;font-style:normal;font-weight:400;font-size:1.35em;background:linear-gradient(90deg,#d9a84a,#fff1c1,#c08a2e,#fbe7a9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:8px;font-size:clamp(14px,3.6vw,18px);color:rgba(255,236,230,.85)}
/* photo frames */
.frames{position:absolute;top:12%;left:0;right:0;height:62%}
.frame{position:absolute;width:clamp(120px,30vw,200px);aspect-ratio:4/5;padding:12px;background:linear-gradient(135deg,#7a5a17,#f7e2a0 22%,#b8892d 45%,#fff1c1 60%,#8a6a1e 85%);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.25);opacity:0;transform:translateY(-20px) scale(.9);transition:all 1s cubic-bezier(.2,1.2,.4,1);cursor:pointer}
.frame.in{opacity:1;transform:rotate(var(--r)) }
.frame .ph{width:100%;height:100%;overflow:hidden;background:linear-gradient(160deg,#f3dde3,#d9b8c4);box-shadow:inset 0 0 0 4px #fff8ee,inset 0 0 30px rgba(0,0,0,.25);display:grid;place-items:center}
.frame .ph img{width:100%;height:100%;object-fit:cover;animation:kb 9s ease-in-out infinite alternate}@keyframes kb{to{transform:scale(1.12) translate(-3%,-2%)}}
.frame .ph span{font:600 12px Inter;color:#8a5a6a;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:10px}
.spot{position:absolute;top:-20%;width:46%;height:120%;background:radial-gradient(50% 60% at 50% 0,rgba(255,240,220,.22),transparent 70%);pointer-events:none}
/* cake */
.cake{position:relative;width:min(84vw,56vh,470px);margin-top:3vh}
.cake svg{width:100%;overflow:visible;display:block}
.cnd{cursor:pointer}
.fl{transform-origin:center bottom;transform-box:fill-box;animation:flick .12s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scale(1,1) skewX(0)}100%{transform:scale(1.04,.95) skewX(2deg)}}
.glow{transform-box:fill-box;transform-origin:center;animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{to{opacity:.75;transform:scale(1.1)}}
.cnd.out .fl,.cnd.out .glow{opacity:0;transition:opacity .25s;animation:none}
.smk{opacity:0}.cnd.out .smk{animation:smk 2.2s ease-out forwards}@keyframes smk{0%{opacity:.55;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-70px) scale(2.2)}}
.lightwash{position:absolute;inset:0;z-index:4;background:radial-gradient(40% 35% at 50% 62%,rgba(255,190,110,.35),transparent 70%);transition:opacity .8s;pointer-events:none}
/* final card */
.card{max-width:min(88vw,520px);padding:26px 24px 22px;border-radius:18px;background:linear-gradient(160deg,rgba(255,250,244,.97),rgba(250,236,232,.97));color:var(--ink);box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 0 0 1px rgba(185,140,60,.5),inset 0 0 0 7px rgba(255,255,255,.7),inset 0 0 0 8px rgba(185,140,60,.4)}
.card h2{font:800 clamp(24px,6.2vw,36px)/1.1 'Playfair Display',serif;background:linear-gradient(90deg,#8a6a1e,#c99a3a,#8a6a1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2 i{display:block;font:400 1.5em 'Great Vibes',cursive;background:linear-gradient(90deg,#b23a6a,#e07aa0,#b23a6a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:4px}
.card p{margin-top:12px;font:400 clamp(15px,3.9vw,17px)/1.6 Inter;color:#4b3446}
.card .fr{margin-top:12px;font:400 26px 'Great Vibes',cursive;color:#a0476d}
.row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 20px;font:700 15px Inter;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.08),inset 0 0 0 1px #e4cfa0;text-decoration:none}
.btn.g{background:linear-gradient(90deg,#b8892d,#f1d48a,#b8892d);color:#3a2608}
.hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:rgba(20,10,18,.72);backdrop-filter:blur(6px);border:1px solid rgba(247,226,160,.45);color:#fbe9c0;font:600 15px Inter;padding:10px 18px;border-radius:999px;white-space:nowrap;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
.start{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 45%,#2a1424,#07050b 70%);cursor:pointer;padding:24px}
.switch{width:78px;height:118px;margin:0 auto 18px;border-radius:14px;background:linear-gradient(160deg,#f6efe4,#d7cbb8);box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.6);position:relative}
.switch:after{content:'';position:absolute;left:24px;right:24px;top:22px;height:44px;border-radius:8px;background:linear-gradient(#fff,#e6dccb);box-shadow:0 6px 8px rgba(0,0,0,.25);transition:all .25s}
.start.on .switch:after{top:52px;box-shadow:0 -4px 8px rgba(0,0,0,.2)}
.start h1{font:800 clamp(24px,6vw,36px)/1.15 'Playfair Display',serif}.start p{margin-top:8px;color:rgba(255,236,230,.75)}
.snd{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:45;width:42px;height:42px;border-radius:50%;border:1px solid rgba(247,226,160,.5);background:rgba(20,10,18,.6);color:#fbe9c0;font-size:18px;cursor:pointer}
.brand{position:fixed;left:12px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;font:600 11px Inter;color:rgba(255,236,230,.45)}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(8,4,8,.85);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s}.zoom.on{opacity:1;pointer-events:auto}
.zoom img{max-width:88vw;max-height:80vh;border:12px solid #f3e1b0;border-radius:4px;box-shadow:0 30px 80px #000}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
