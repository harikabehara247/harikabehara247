<style>
/* H View · "Toy Zoo Party" (r87, 26 Nov 2026): a live 3D world for little kids (three.js, WebGL).
   Gift box on a grassy island -> baby animals pop out -> pop their balloons to fly gold 3D letters of the name ->
   a giant gold number -> a 3D cake with real flickering candles to blow out -> fireworks and a dance. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
html,body{height:100%;overflow:hidden;background:#bfe6ff;font-family:'Baloo 2',system-ui,sans-serif}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;left:0;right:0;z-index:5;text-align:center;pointer-events:none;padding:0 16px}
.top{top:calc(18px + env(safe-area-inset-top))}
.title{font:800 clamp(26px,7vw,44px)/1.05 'Baloo 2';color:#fff;text-shadow:0 3px 0 rgba(90,60,150,.35),0 8px 24px rgba(60,40,120,.35);opacity:0;transform:translateY(-10px);transition:all .6s}
.title.on{opacity:1;transform:none}
.sub{margin-top:6px;font:600 clamp(15px,4vw,19px) 'Baloo 2';color:#fff;text-shadow:0 2px 10px rgba(60,40,120,.45);opacity:0;transition:opacity .6s}
.sub.on{opacity:1}
.hint{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;background:#fff;color:#4b2e83;font:800 17px 'Baloo 2';padding:10px 22px;border-radius:999px;box-shadow:0 6px 0 #d9c9ff,0 14px 30px rgba(60,40,120,.25);white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.hint[hidden]{display:none}@keyframes bob{50%{transform:translate(-50%,-7px)}}
.hold{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));width:112px;height:112px;margin-left:-56px;border-radius:50%;border:0;z-index:7;background:radial-gradient(circle at 35% 30%,#fff,#ffe1f0 60%,#ffc2df);box-shadow:0 8px 0 #f39ac4,0 18px 40px rgba(150,40,100,.3);font:800 15px/1.1 'Baloo 2';color:#b0306f;touch-action:none;cursor:pointer}
.hold[hidden]{display:none}.hold svg{position:absolute;inset:-8px;width:128px;height:128px;transform:rotate(-90deg)}.hold circle{fill:none;stroke:#ff5fa8;stroke-width:6;stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377}
.card{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);width:min(92vw,460px);z-index:8;background:rgba(255,255,255,.94);border-radius:26px;padding:18px 20px 16px;text-align:center;box-shadow:0 10px 0 #e6dcff,0 30px 60px rgba(60,40,120,.3);opacity:0;pointer-events:none;transition:all .7s cubic-bezier(.2,1.4,.4,1)}
.card.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.card h2{font:800 clamp(22px,6vw,30px)/1.1 'Baloo 2';background:linear-gradient(90deg,#ff5fa8,#8a6cff,#33b6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card p{margin-top:8px;font:600 15px/1.45 'Baloo 2';color:#5b4a86}.card .fr{margin-top:6px;font:800 16px 'Baloo 2';color:#ff5fa8}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 18px;font:800 15px 'Baloo 2';cursor:pointer;background:#fff;color:#4b2e83;box-shadow:0 5px 0 #d9c9ff;text-decoration:none}
.btn.p{background:linear-gradient(90deg,#ff5fa8,#8a6cff);color:#fff;box-shadow:0 5px 0 #6b4fd6}
.snd{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:9;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:20px;cursor:pointer;box-shadow:0 4px 0 #d9c9ff}
.load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:linear-gradient(#9fd8ff,#ffe3f1);font:800 22px 'Baloo 2';color:#fff;text-shadow:0 2px 8px rgba(60,40,120,.4);transition:opacity .6s}
.brand{position:fixed;left:12px;bottom:calc(6px + env(safe-area-inset-bottom));z-index:4;font:600 11px 'Baloo 2';color:rgba(75,46,131,.55)}
.nogl{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font:700 18px 'Baloo 2';color:#4b2e83}
</style>

<body>
<canvas id="gl"></canvas>
<div class="ui top"><div class="title" id="title"></div><div class="sub" id="sub"></div></div>
<div class="hint" id="hint" hidden></div>
<button class="hold" id="hold" hidden aria-label="Press and hold to blow out the candles"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="60" id="ring"/></svg>Hold to<br>blow 🌬️</button>
<div class="card" id="card"><h2 id="cardT"></h2><p id="cardM"></p><div class="fr" id="cardF"></div><div class="row"><button class="btn p" id="again">▶ Play again</button><a class="btn" href="https://hview.in/interactive/birthday/" target="_blank" rel="noopener">Make one for a friend</a></div></div>
<button class="snd" id="snd" aria-label="Sound on or off">🔊</button>
<div class="load" id="load">Getting the party ready…</div>
<div class="brand">Made with ♥ on H View</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from './lib/RoundedBoxGeometry.js';
import { RoomEnvironment } from './lib/RoomEnvironment.js';
import { FontLoader } from './lib/FontLoader.js';
import { TextGeometry } from './lib/TextGeometry.js';

let HV = {}; try { HV = JSON.parse(decodeURIComponent(location.hash.slice(1))) || {}; } catch (e) {}
if (window.HV_DATA) HV = Object.assign({}, window.HV_DATA, HV);
const NAME = String(HV.to || 'Little Star').trim().slice(0, 12);
const AGE = Math.max(1, Math.min(9, parseInt(HV.age, 10) || 4));
const FROM = String(HV.from || '').trim().slice(0, 60);
const MSG = String(HV.msg || `Happy birthday, ${NAME}! All your zoo friends came to celebrate you today. Have the most wonderful, giggly, cake-filled day. We love you!`).slice(0, 360);
const AUTO = HV.autoplay === true;
const POST = m => { try { parent.postMessage({ hv: m }, '*'); } catch (e) {} };
const $ = s => document.querySelector(s);
const ORD = ({ 1: 'st', 2: 'nd', 3: 'rd' })[AGE] || 'th';

/* ------------------------------------------------ renderer + world */
const canvas = $('#gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) { document.body.innerHTML = '<div class="nogl">Happy birthday, ' + NAME.replace(/</g, '') + '! 🎉<br><small>This surprise needs a newer browser to show its 3D party.</small></div>'; throw e; }
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(42, 1, .1, 200);

/* sky dome with a soft vertical gradient */
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { top: { value: new THREE.Color('#6ec6ff') }, mid: { value: new THREE.Color('#bfe8ff') }, bot: { value: new THREE.Color('#ffe3f1') } },
  vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; varying vec3 vP; void main(){ float h = normalize(vP).y; vec3 c = h > 0.0 ? mix(mid, top, smoothstep(0.0, .6, h)) : mix(mid, bot, smoothstep(0.0, -.3, h)); gl_FragColor = vec4(c,1.0); }' });
scene.add(new THREE.Mesh(new THREE.SphereGeometry(90, 32, 16), skyMat));

/* lights: warm sun with soft shadows + cool sky fill */
const hemi = new THREE.HemisphereLight('#d8f0ff', '#f7c9de', .9); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3dc', 2.4); sun.position.set(6, 12, 7); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, near: 1, far: 40 }); sun.shadow.radius = 6; sun.shadow.bias = -.0005;
scene.add(sun);

/* materials: soft toy plastic (clearcoat), felt, gold foil */
const toy = (c, o = {}) => new THREE.MeshPhysicalMaterial(Object.assign({ color: c, roughness: .42, clearcoat: .55, clearcoatRoughness: .3, sheen: .2 }, o));
const gold = new THREE.MeshPhysicalMaterial({ color: '#ffcf5a', metalness: 1, roughness: .18, clearcoat: 1, clearcoatRoughness: .08 });
const rose = new THREE.MeshPhysicalMaterial({ color: '#ff9cc4', metalness: .85, roughness: .2, clearcoat: 1 });
const shadowCatch = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };

/* island: rounded grass top, cream cliff, little trees, flowers, fence */
const world = new THREE.Group(); scene.add(world);
const grass = shadowCatch(new THREE.Mesh(new THREE.CylinderGeometry(7.2, 7.4, .5, 64), toy('#5fcf62', { roughness: .85, clearcoat: .05 }))); grass.position.y = -.25; world.add(grass);
const cliff = shadowCatch(new THREE.Mesh(new THREE.CylinderGeometry(7.3, 5.2, 2.4, 64), toy('#ffe7c2', { roughness: .9, clearcoat: 0 }))); cliff.position.y = -1.7; world.add(cliff);
const path = new THREE.Mesh(new THREE.RingGeometry(3.4, 4.3, 64), toy('#ffe2b8', { roughness: .9 })); path.rotation.x = -Math.PI / 2; path.position.y = .01; path.receiveShadow = true; world.add(path);
function tree(x, z, s) { const g = new THREE.Group(); const tr = shadowCatch(new THREE.Mesh(new THREE.CylinderGeometry(.12, .16, .8, 12), toy('#c98f5a'))); tr.position.y = .4; g.add(tr);
  [[0, 1.05, 0, .62], [.25, .85, .15, .42], [-.25, .9, -.1, .45]].forEach(([a, b, c, r]) => { const m = shadowCatch(new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), toy(['#5fd06b', '#7ee07a', '#4cc25f'][Math.floor(Math.random() * 3)]))); m.position.set(a, b, c); g.add(m); });
  g.position.set(x, 0, z); g.scale.setScalar(s); world.add(g); return g; }
const trees = [[-5.6, -2.5, 1.2], [5.4, -2.8, 1.1], [-4.4, -4.6, .9], [4.6, -4.4, .95], [0, -5.9, 1.25], [-6.2, 1.8, .8], [6.3, 1.5, .85]].map(t => tree(...t));
const flowerCols = ['#ff6fae', '#ffd23f', '#ffffff', '#b08cff', '#ff9e5e'];
for (let i = 0; i < 46; i++) { const a = Math.random() * Math.PI * 2, r = 4.6 + Math.random() * 2.3, f = new THREE.Mesh(new THREE.SphereGeometry(.09, 10, 8), toy(flowerCols[i % 5])); f.position.set(Math.cos(a) * r, .08, Math.sin(a) * r); world.add(f); }
for (let i = 0; i < 26; i++) { const a = -Math.PI * .95 + i * (Math.PI * 1.9 / 25), p = shadowCatch(new THREE.Mesh(new RoundedBoxGeometry(.14, .5, .14, 2, .05), toy('#fff'))); p.position.set(Math.cos(a) * 6.75, .25, Math.sin(a) * 6.75); world.add(p); }
/* fluffy clouds */
const clouds = []; for (let i = 0; i < 6; i++) { const c = new THREE.Group(); [[0, 0, 0, 1], [1, .1, 0, .8], [-1, .05, 0, .75], [.4, .45, 0, .7]].forEach(([x, y, z, r]) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), toy('#ffffff', { roughness: .9, clearcoat: 0, transparent: true, opacity: .95 })); m.position.set(x, y, z); c.add(m); }); c.position.set(-20 + i * 8, 7 + Math.random() * 4, -16 - Math.random() * 8); c.scale.setScalar(.9 + Math.random() * .8); scene.add(c); clouds.push(c); }

/* ------------------------------------------------ cute animals built from soft shapes */
const S = (r, c, ws = 28) => shadowCatch(new THREE.Mesh(new THREE.SphereGeometry(r, ws, ws * .7 | 0), typeof c === 'string' ? toy(c) : c));
const eyeMat = toy('#1d1530', { roughness: .15, clearcoat: 1 }), white = toy('#ffffff'), blush = toy('#ff9fbf', { transparent: true, opacity: .75 });
function face(head, r, y = 0, z = .9, spread = .32) {
  const eyes = []; [-1, 1].forEach(s => { const e = S(r * .13, eyeMat, 16); e.position.set(s * r * spread, r * (.12 + y), r * z); e.scale.set(1, 1.15, .7); head.add(e); eyes.push(e);
    const hl = S(r * .045, white, 10); hl.position.set(r * .04, r * .05, r * .1); e.add(hl);
    const b = S(r * .12, blush, 12); b.position.set(s * r * (spread + .18), r * (-.12 + y), r * (z - .08)); b.scale.set(1, .6, .3); head.add(b); });
  const smile = new THREE.Mesh(new THREE.TorusGeometry(r * .12, r * .025, 8, 20, Math.PI), eyeMat); smile.rotation.z = Math.PI; smile.position.set(0, r * (-.12 + y), r * (z + .02)); head.add(smile);
  return eyes;
}
function hat(parent, y, c1, c2) { const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128; const x = cv.getContext('2d'); for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? c1 : c2; x.fillRect(0, i * 16, 128, 16); }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; const h = shadowCatch(new THREE.Mesh(new THREE.ConeGeometry(.22, .5, 24), toy('#ffffff', { map: t }))); h.position.y = y; h.rotation.z = -.15; parent.add(h);
  const pom = S(.07, '#ffe14d', 12); pom.position.y = .27; h.add(pom); return h; }
function legs(g, col, n = 4, sp = .28, y = .18) { const L = []; [[-sp, sp * .8], [sp, sp * .8], [-sp, -sp * .8], [sp, -sp * .8]].slice(0, n).forEach(([x, z]) => { const l = shadowCatch(new THREE.Mesh(new THREE.CapsuleGeometry(.12, .16, 6, 12), toy(col))); l.position.set(x, y, z); g.add(l); L.push(l); }); return L; }

function makeElephant() { const g = new THREE.Group(), body = S(.62, '#a9c3ff'); body.position.y = .72; body.scale.set(1, .9, 1.05); g.add(body);
  const head = S(.48, '#a9c3ff'); head.position.set(0, 1.25, .45); g.add(head);
  [-1, 1].forEach(s => { const ear = S(.36, '#c7d7ff'); ear.position.set(s * .48, 1.32, .3); ear.scale.set(.25, 1, .8); ear.rotation.y = s * .4; g.add(ear); });
  const trunk = shadowCatch(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0, 1.12, .88), new THREE.Vector3(0, .9, 1.05), new THREE.Vector3(0, .72, 1.08), new THREE.Vector3(0, .64, 1.22)]), 20, .09, 12), toy('#a9c3ff'))); g.add(trunk);
  const eyes = face(head, .48, .15, .88, .36); legs(g, '#94b2f6', 4, .32); const h = hat(head, .52, '#ff6fae', '#ffffff'); return { g, head, eyes, hat: h, color: '#a9c3ff', top: 1.85 }; }
function makeGiraffe() { const g = new THREE.Group(), body = S(.5, '#ffd36b'); body.position.y = .82; body.scale.set(1, .85, 1.25); g.add(body);
  const neck = shadowCatch(new THREE.Mesh(new THREE.CapsuleGeometry(.16, .95, 8, 16), toy('#ffd36b'))); neck.position.set(0, 1.55, .32); neck.rotation.x = .25; g.add(neck);
  const head = S(.3, '#ffd36b'); head.position.set(0, 2.2, .52); head.scale.set(1, .9, 1.15); g.add(head);
  [-1, 1].forEach(s => { const o = shadowCatch(new THREE.Mesh(new THREE.CapsuleGeometry(.04, .14, 4, 8), toy('#c98a2e'))); o.position.set(s * .13, .3, 0); head.add(o); const k = S(.06, '#c98a2e', 10); k.position.y = .1; o.add(k); });
  for (let i = 0; i < 14; i++) { const sp = S(.075 + Math.random() * .05, '#e09a3a', 10); const a = Math.random() * Math.PI * 2, y = Math.random(); sp.position.set(Math.cos(a) * .48, (y - .5) * .7, Math.sin(a) * .58); sp.scale.set(1, 1, .3); sp.lookAt(0, 0, 0); body.add(sp); }
  const eyes = face(head, .3, .25, .85, .4); legs(g, '#f5c45a', 4, .26, .2); const h = hat(head, .38, '#33b6ff', '#ffffff'); return { g, head, eyes, hat: h, color: '#ffd36b', top: 2.75 }; }
function makeBunny() { const g = new THREE.Group(), body = S(.5, '#ffffff'); body.position.y = .55; body.scale.set(1, 1.05, .95); g.add(body);
  const head = S(.42, '#ffffff'); head.position.set(0, 1.18, .12); g.add(head);
  [-1, 1].forEach(s => { const ear = shadowCatch(new THREE.Mesh(new THREE.CapsuleGeometry(.11, .5, 6, 14), toy('#ffffff'))); ear.position.set(s * .17, .55, -.02); ear.rotation.z = -s * .18; head.add(ear); const inn = shadowCatch(new THREE.Mesh(new THREE.CapsuleGeometry(.055, .38, 6, 10), toy('#ffc0d8'))); inn.position.z = .07; ear.add(inn); });
  const tail = S(.16, '#ffffff', 14); tail.position.set(0, .45, -.5); g.add(tail); const nose = S(.06, '#ff8fb3', 10); nose.position.set(0, -.02, .41); head.add(nose);
  const eyes = face(head, .42, .1, .86, .34); legs(g, '#f6f0f7', 2, .22, .1); return { g, head, eyes, hat: null, color: '#ffffff', top: 2.2 }; }
function makeBear() { const g = new THREE.Group(), body = S(.55, '#d8a06e'); body.position.y = .68; g.add(body);
  const belly = S(.36, '#f6dcbf'); belly.position.set(0, .62, .3); belly.scale.set(1, 1.1, .6); g.add(belly);
  const head = S(.44, '#d8a06e'); head.position.set(0, 1.35, .1); g.add(head);
  [-1, 1].forEach(s => { const ear = S(.15, '#d8a06e', 14); ear.position.set(s * .32, .34, -.02); head.add(ear); const inn = S(.08, '#f6dcbf', 10); inn.position.set(0, 0, .07); ear.add(inn); });
  const snout = S(.17, '#f6dcbf', 16); snout.position.set(0, -.08, .38); snout.scale.set(1.2, .9, .8); head.add(snout); const nose = S(.06, '#3a2420', 10); nose.position.set(0, .05, .13); snout.add(nose);
  const eyes = face(head, .44, .2, .86, .34); legs(g, '#c98f5a', 4, .3); const h = hat(head, .5, '#8a6cff', '#ffe14d'); return { g, head, eyes, hat: h, color: '#d8a06e', top: 2.05 }; }
function makeLion() { const g = new THREE.Group(), body = S(.52, '#ffc65a'); body.position.y = .7; body.scale.set(1, .9, 1.15); g.add(body);
  const head = S(.4, '#ffd77a'); head.position.set(0, 1.3, .38); g.add(head);
  for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, m = S(.16, i % 2 ? '#f08c2a' : '#ff9f3a', 12); m.position.set(Math.cos(a) * .42, Math.sin(a) * .42, -.12); head.add(m); }
  const eyes = face(head, .4, .12, .88, .34); legs(g, '#f5b44a', 4, .28); const tail = shadowCatch(new THREE.Mesh(new THREE.CapsuleGeometry(.05, .5, 4, 8), toy('#ffc65a'))); tail.position.set(0, .8, -.62); tail.rotation.x = -.8; g.add(tail);
  const h = hat(head, .62, '#5ee0c0', '#ffffff'); return { g, head, eyes, hat: h, color: '#ffc65a', top: 2.15 }; }

/* balloons each animal holds; popping one flies a gold letter up */
const balloonCols = ['#ff5fa8', '#33b6ff', '#ffd23f', '#8a6cff', '#5ee0c0', '#ff8a5c'];
function balloon(c) { const g = new THREE.Group(); const b = shadowCatch(new THREE.Mesh(new THREE.SphereGeometry(.42, 32, 24), new THREE.MeshPhysicalMaterial({ color: c, roughness: .18, clearcoat: 1, clearcoatRoughness: .05, sheen: .3 }))); b.scale.set(1, 1.18, 1); g.add(b);
  const knot = S(.07, c, 10); knot.position.y = -.5; g.add(knot);
  const str = new THREE.Mesh(new THREE.CylinderGeometry(.008, .008, 1.4, 6), new THREE.MeshBasicMaterial({ color: '#ffffff' })); str.position.y = -1.2; g.add(str); g.userData.ball = b; return g; }

/* ------------------------------------------------ gift box */
const gift = new THREE.Group(); world.add(gift);
const boxMat = toy('#ff7eb6', { clearcoat: .9 }), ribMat = toy('#fff2a8', { metalness: .3, roughness: .3, clearcoat: 1 });
const base = shadowCatch(new THREE.Mesh(new RoundedBoxGeometry(2.2, 1.7, 2.2, 4, .12), boxMat)); base.position.y = .85; gift.add(base);
[[.36, 1.74, 2.26], [2.26, 1.74, .36]].forEach(([a, b, c]) => { const r = shadowCatch(new THREE.Mesh(new RoundedBoxGeometry(a, b, c, 2, .05), ribMat)); r.position.y = .85; gift.add(r); });
const lid = new THREE.Group(); lid.position.y = 1.72; gift.add(lid);
const lidBox = shadowCatch(new THREE.Mesh(new RoundedBoxGeometry(2.45, .42, 2.45, 4, .14), boxMat)); lid.add(lidBox);
[[.38, .45, 2.5], [2.5, .45, .38]].forEach(([a, b, c]) => { const r = shadowCatch(new THREE.Mesh(new RoundedBoxGeometry(a, b, c, 2, .06), ribMat)); lid.add(r); });
[-1, 1].forEach(s => { const loop = shadowCatch(new THREE.Mesh(new THREE.TorusGeometry(.38, .12, 16, 32), ribMat)); loop.position.set(s * .38, .48, 0); loop.rotation.set(0, Math.PI / 2, s * .9); loop.scale.set(1, 1, .6); lid.add(loop); });
const knotB = S(.18, ribMat, 16); knotB.position.y = .36; lid.add(knotB);

/* ------------------------------------------------ cake with live candles */
const cake = new THREE.Group(); cake.visible = false; world.add(cake);
const tier = (r, h, y, c) => { const m = shadowCatch(new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 64), toy(c, { roughness: .55, clearcoat: .3 }))); m.position.y = y; cake.add(m); return m; };

    const face = Math.atan2(camera.position.x - a.g.position.x, camera.position.z - a.g.position.z);
    a.g.rotation.y = face + (a.spin > 0 ? (1 - (a.spin = Math.max(0, a.spin - dt * 1.4))) * Math.PI * 2 : 0) + (dancing ? Math.sin(ph * 1.6) * .35 : 0);
    a.head.rotation.z = Math.sin(ph * .7) * .08; a.head.rotation.x = Math.sin(ph * .5) * .05;
    a.blink -= dt; const closed = a.blink < .12; a.eyes.forEach(e => e.scale.y = closed ? .15 : 1.15); if (a.blink < 0) a.blink = 2 + Math.random() * 3;
    if (a.hat) a.hat.rotation.z = -.15 + Math.sin(ph * 1.3) * .08; });
  heldBalloons.forEach((b, k) => { if (!b.parent) return; const a = b.userData.anchor; const tgt = a.g.position.clone().add(b.userData.off); tgt.x += Math.sin(T * 1.3 + k) * .25; tgt.y += Math.sin(T * 1.7 + k) * .12; b.position.lerp(tgt, 1 - Math.pow(.001, dt)); b.rotation.z = Math.sin(T * 1.1 + k) * .12; });
  letterMeshes.forEach((m, i) => { if (m.visible) m.rotation.x = Math.sin(T * 1.6 + i * .6) * .12; });
  if (numberMesh && numberMesh.visible && stage === 'number') numberMesh.rotation.y = Math.sin(T * .9) * .4;
  candles.forEach((c, i) => { if (c.out) return; const f = .85 + Math.sin(T * 23 + i * 3) * .08 + Math.random() * .07; c.flame.scale.y = 1.9 * f; c.glow.material.opacity = .7 + Math.random() * .3; if (c.light.intensity > 0) c.light.intensity = 1.8 + Math.random() * .6; });
  clouds.forEach((c, i) => { c.position.x += dt * (.3 + i * .05); if (c.position.x > 26) c.position.x = -26; });
  if (gift.visible && stage === 'gift') { gift.rotation.z = Math.sin(T * 9) * .04 * (Math.sin(T * 1.4) > .3 ? 1 : 0); gift.position.y = Math.max(0, Math.sin(T * 9)) * .06 * (Math.sin(T * 1.4) > .3 ? 1 : 0); }
  for (let i = 0; i < CONF; i++) { const p = cp[i]; if (!p.on) continue; p.life += dt; p.v.y -= 9 * dt; p.v.multiplyScalar(1 - 1.6 * dt); p.v.y = Math.max(p.v.y, -1.6); p.p.addScaledVector(p.v, dt); p.r.x += p.vr.x * dt; p.r.y += p.vr.y * dt; p.r.z += p.vr.z * dt;
    if (p.life > 5 || p.p.y < -2) { p.on = false; tmp.scale.setScalar(0); } else { tmp.position.copy(p.p); tmp.rotation.copy(p.r); tmp.scale.setScalar(1); } tmp.updateMatrix(); conf.setMatrixAt(i, tmp.matrix); }
  conf.instanceMatrix.needsUpdate = true;
  for (let i = smokes.length - 1; i >= 0; i--) { const s = smokes[i], u = s.userData; u.d -= dt; if (u.d > 0) continue; u.life += dt; s.position.addScaledVector(u.v, dt); s.scale.setScalar(.25 + u.life * .9); s.material.opacity = Math.max(0, .6 - u.life * .35); if (u.life > 1.8) { scene.remove(s); smokes.splice(i, 1); } }
  renderer.render(scene, camera); requestAnimationFrame(loop); }

  undefined, () => { $('#load').textContent = 'Could not load the party. Please refresh.'; });
